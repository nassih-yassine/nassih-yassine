  <rect width="1200" height="320" fill="url(#bg)"/>
  <rect width="1200" height="320" fill="url(#stars)"/>

  <rect x="0" y="0" width="1200" height="3" fill="url(#line)"/>

  <g font-family="'JetBrains Mono','SFMono-Regular',Consolas,monospace">
    <text x="80" y="126" fill="#8FC9C6" font-size="15" letter-spacing="6">SOFTWARE ENGINEER</text>
    <text x="78" y="196" fill="#E7EFEE" font-size="58" font-weight="700" letter-spacing="1">YASSINE NASSIH</text>
    <text x="80" y="240" fill="#9FB8B6" font-size="17" letter-spacing="1">test automation · developer tooling · AI-assisted workflows</text>
