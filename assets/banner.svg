    <path d="M0 0 L60 0 L60 60 L0 60 Z"/>
    <path d="M0 0 L60 60 M60 0 L0 60"/>
    <circle cx="30" cy="30" r="18"/>
  </g>

  <g font-family="'JetBrains Mono','SFMono-Regular',Consolas,monospace">
