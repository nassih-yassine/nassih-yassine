<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="Yassine Nassih — Software Engineer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B1517"/>
      <stop offset="55%" stop-color="#0F2A2C"/>
      <stop offset="100%" stop-color="#0B1517"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8FC9C6" stop-opacity="0"/>
      <stop offset="45%" stop-color="#8FC9C6" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#E3BE86" stop-opacity="0"/>
